<section class="mx-auto w-full max-w-4xl px-6 py-12">
  <app-hero />

  <div class="mt-10 flex flex-wrap items-center justify-between gap-4">
    <h1 class="text-2xl font-bold text-dark">Mes snippets</h1>

    <a
      routerLink="/dashboard/snippets-post"
      class="rounded-full bg-mint px-4 py-2 text-sm font-semibold text-dark hover:bg-darkmint hover:text-white"
    >
      + Nouveau snippet
    </a>
  </div>

  @if (loading()) {
  <p class="mt-8 text-sm text-darkmint">Chargement…</p>
  } @else if (error()) {
  <p class="mt-8 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">
    Impossible de charger les snippets.
  </p>
  } @else {
  <div class="mt-6 flex flex-col gap-4">
    @for (snippet of snippets(); track snippet.id) {
    <app-snippet-box [snippet]="snippet" (deleted)="onDeleted($event)" (modified)="onModified($event)" />
    } @empty {
    <p class="rounded-2xl border border-dashed border-darksurface p-10 text-center text-sm text-darkmint">
      Aucun snippet pour l'instant.
    </p>
    }
  </div>
  }
</section>
