<h1 class="text-xl font-bold mb-4">Mes snippets</h1>

@if (loading()) {
<p>Chargement…</p>
} @if (error()) {
<p class="text-red-600">Impossible de charger les snippets.</p>
}

<div class="flex flex-col gap-3 max-w-2xl">
  @for (snippet of snippets(); track snippet.id) {
  <app-snippet-box [snippet]="snippet" />
  } @empty { @if (!loading() && !error()) {
  <p>Aucun snippet pour l'instant.</p>
  } }
</div>
