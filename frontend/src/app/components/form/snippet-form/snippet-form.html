<form
  (ngSubmit)="submit()"
  class="flex w-full flex-col gap-4 rounded-2xl border border-darksurface bg-surface/40 p-5"
>
  <label class="flex flex-col gap-1.5 text-sm font-semibold text-dark">
    Titre
    <input
      name="title"
      [(ngModel)]="title"
      required
      class="rounded-xl border border-darksurface bg-white px-3 py-2 text-sm font-normal text-dark outline-none focus:border-mint focus:ring-2 focus:ring-mint/40"
    />
  </label>

  <label class="flex flex-col gap-1.5 text-sm font-semibold text-dark">
    Langage
    <select
      name="language"
      [(ngModel)]="language"
      class="cursor-pointer rounded-xl border border-darksurface bg-white px-3 py-2 text-sm font-normal text-dark outline-none focus:border-mint focus:ring-2 focus:ring-mint/40"
    >
      <option [ngValue]="null">— aucun —</option>
      @for (lang of languages; track lang) {
      <option [ngValue]="lang">{{ lang }}</option>
      }
    </select>
  </label>

  <label class="flex flex-col gap-1.5 text-sm font-semibold text-dark">
    Code
    <textarea
      name="code"
      [(ngModel)]="code"
      required
      rows="8"
      spellcheck="false"
      class="rounded-xl border border-darksurface bg-dark px-3 py-2 font-mono text-sm font-normal text-white outline-none focus:border-mint focus:ring-2 focus:ring-mint/40"
    ></textarea>
  </label>

  <label class="flex flex-col gap-1.5 text-sm font-semibold text-dark">
    Description (optionnelle)
    <textarea
      name="description"
      [(ngModel)]="description"
      rows="2"
      class="rounded-xl border border-darksurface bg-white px-3 py-2 text-sm font-normal text-dark outline-none focus:border-mint focus:ring-2 focus:ring-mint/40"
    ></textarea>
  </label>

  <button
    type="submit"
    class="cursor-pointer self-start rounded-full bg-mint px-4 py-2 text-sm font-semibold text-dark hover:bg-darkmint hover:text-white"
  >
    {{ snippet() ? 'Enregistrer' : 'Créer le snippet' }}
  </button>
</form>
