<article class="border rounded p-3">
  <div class="flex items-baseline justify-between">
    <h2 class="font-semibold">{{ snippet().title }}</h2>
    @if (snippet().language) {
      <span class="text-xs text-gray-500">{{ snippet().language }}</span>
    }
  </div>
  @if (snippet().description) {
    <p class="text-sm">{{ snippet().description }}</p>
  }

  @if (highlighted(); as html) {
    <div [innerHTML]="html"></div>
  } @else {
    <!-- affichage brut le temps que shiki rende (une fraction de seconde) -->
    <pre class="rounded p-2 mt-2 overflow-x-auto"><code>{{ snippet().code }}</code></pre>
  }
</article>
