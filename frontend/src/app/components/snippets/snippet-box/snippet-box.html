<article class="rounded-2xl border border-darksurface bg-white p-5">
  <div class="flex flex-wrap items-baseline justify-between gap-2">
    <h2 class="font-bold text-dark">{{ snippet().title }}</h2>

    @if (snippet().language) {
    <span class="rounded-full bg-sun px-2 py-0.5 font-mono text-xs text-dark">
      {{ snippet().language }}
    </span>
    }
  </div>

  @if (snippet().description) {
  <p class="mt-1 text-sm text-darkmint">{{ snippet().description }}</p>
  }

  @if (highlighted(); as html) {
  <div [innerHTML]="html"></div>
  } @else {
  <!-- affichage brut le temps que shiki rende (une fraction de seconde) -->
  <pre class="mt-3 overflow-x-auto rounded-xl bg-dark p-4 text-sm text-white"><code>{{ snippet().code }}</code></pre>
  }

  <div class="mt-3 flex flex-wrap gap-2">
    <app-snippet-modify-button [snippet]="snippet()" (modified)="modified.emit($event)" />
    <app-snippet-delete-button [snippetId]="snippet().id" (deleted)="deleted.emit($event)" />
  </div>
</article>
