@if (editing()) {
<!-- [snippet] fourni → le formulaire est en mode édition : pré-rempli, PATCH au submit -->
<app-snippet-form [snippet]="snippet()" (saved)="onSaved($event)" />
<button
  (click)="editing.set(false)"
  class="mt-3 cursor-pointer rounded-full border border-darksurface px-3 py-1 text-sm text-dark hover:bg-darksurface"
>
  Annuler
</button>
} @else {
<button
  (click)="editing.set(true)"
  class="cursor-pointer rounded-full border border-darksurface px-3 py-1 text-sm text-dark hover:border-mint hover:bg-mint"
>
  Modifier
</button>
}
